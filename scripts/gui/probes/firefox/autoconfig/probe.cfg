// command-line probe (scripts/gui/probes/firefox)
try {
  const P = (m) => dump("PROBE " + m + "\n");
  const str = (x) => { try { return x instanceof Ci.nsIURI ? `<${x.spec}>` : JSON.stringify(x); } catch { return String(x); } };
  // /proc files have no size, so streams that read by size see nothing: read a byte at a time
  const readProc = (path) => {
    const f = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
    f.initWithPath(path);
    const fis = Cc["@mozilla.org/network/file-input-stream;1"].createInstance(Ci.nsIFileInputStream);
    fis.init(f, 1, 0, 0);
    const bis = Cc["@mozilla.org/binaryinputstream;1"].createInstance(Ci.nsIBinaryInputStream);
    bis.setInputStream(fis);
    const b = [];
    try { for (;;) b.push(bis.read8()); } catch {}
    fis.close();
    let s = "";
    for (let i = 0; i < b.length; i += 4096) s += String.fromCharCode(...b.slice(i, i + 4096));
    return s;
  };
  const dumpCl = (tag, c) => {
    let s = `${tag} len=${c.length} state=${c.state}:`;
    for (let i = 0; i < c.length; i++) { try { s += ` [${i}]=${JSON.stringify(c.getArgument(i))}`; } catch (e) { s += ` [${i}] threw 0x${(e.result >>> 0).toString(16)}`; } }
    P(s);
  };
  Services.obs.addObserver((subj) => {
    const c = subj.QueryInterface(Ci.nsICommandLine);
    dumpCl("startup", c);
    // where libxul is mapped (for BLINK_WJIT_BISECT=lo:hi): /proc/PID/maps is only served to the process itself
    try {
      // every executable mapping; tabcomputer's maps have no file names: libxul's text is the r-xp one of 0x7283000 bytes (140.12.0esr)
      const mp = readProc("/proc/self/maps").split("\n");
      for (const l of mp) {
        const [lo, hi] = l.split(" ")[0].split("-").map((x) => parseInt(x, 16));
        if (/libxul/.test(l) || / r-xp /.test(l)) P(`maps ${l} (${((hi - lo) / 1024) | 0} KB)`);
      }
    } catch (e) { P("maps failed " + e); }
    const m = ChromeUtils.importESModule("resource:///modules/BrowserContentHandler.sys.mjs");
    for (const [name, cls] of Object.entries(m)) {
      if (typeof cls != "function" || !cls.prototype?.handle) continue;
      const orig = cls.prototype.handle;
      cls.prototype.handle = function (cl) {
        dumpCl(`${name}.handle entry`, cl);
        const px = new Proxy(cl, {
          get(t, k) {
            const v = t[k];
            if (k == "length") { P(`${name}: length -> ${v}`); return v; }
            if (k == "getArgument") return (i) => { try { const r = t.getArgument(i); P(`${name}: getArgument(${i}) -> ${str(r)}`); return r; } catch (e) { P(`${name}: getArgument(${i}) threw; len now ${t.length}`); throw e; } };
            if (typeof v == "function") return (...a) => { const r = v.apply(t, a); P(`${name}: ${String(k)}(${a.map(str).join(",")}) -> ${str(r)}`); return r; };
            return v;
          },
          set(t, k, v) { t[k] = v; return true; },
        });
        try { return orig.call(this, px); } finally { dumpCl(`${name}.handle exit`, cl); }
      };
      P(`patched ${name}.handle`);
    }
  }, "command-line-startup");
} catch (e) { dump("PROBE failed " + e + "\n"); }
